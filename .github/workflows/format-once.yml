name: One-time feature formatter

on:
  push:
    branches: [feat/equipment-training-20-skills]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Save Prettier formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests tools index.html package.json vite.config.ts vitest.config.ts eslint.config.js 2>/dev/null || git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply npm run format"
            git push
          fi
      - run: npm run check
      - run: npx vite build
