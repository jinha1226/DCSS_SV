name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/stage2-floor-persistence]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preview formatting changes
        run: |
          npx prettier --write src/sim/world.ts src/sim/packs.ts src/app/main.ts
          git diff -- src/sim/world.ts src/sim/packs.ts src/app/main.ts
      - run: npm run check
      - run: npm run build
