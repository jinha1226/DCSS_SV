name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/stage2-floor-persistence]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier src/sim/world.ts | diff -u src/sim/world.ts - || true
      - run: npm run check
      - run: npm run build
